# Single placement. One RCU staged ahead of the robot, one slot on the pad; the
# scripted baseline picks, transports, seats, releases, verifies.
name: single_placement
timeout_s: 285.0            # [derived: 1.5 x the 190 s cycle-time budget, docs/reference/requirements.md]
worksite:
  rcu:
    extents_m: [0.43, 0.25, 0.10]   # [ported: docs/reference/requirements.md, RCU geometry and mass]
    mass_kg: 22.0                   # [ported: docs/reference/requirements.md, RCU geometry and mass]
    friction: [1.0, 0.005, 0.0001]  # [policy default: MuJoCo defaults]
    corner_p: 6.0                   # [authored-geometry: rounded bag corners]
  # Top-down magnetic pick (the default end effector): the unit rests on the ground, and
  # the slot is the SECOND course centred on a two-unit foundation (centre z = 0.15 m),
  # which makes the placed-unit disturbance limit (docs/reference/requirements.md)
  # measurable.  [authored-geometry]
  # (With --robot fr3_mpo700_hand the same file runs; the parallel jaw's 0.12 m aperture
  # takes only the 0.10 m face, so that variant grasps by the END -- see placement_skills.)
  # rcu_0's x=3.0 (not the earlier draft's 2.5) is a MEASURED distance,
  # not an authored one: the x1.5 FR3's own `home` keyframe (fr3_joint4=-1.57, fr3_joint6=
  # 1.57) puts the flange ~1.38 m forward of base_link at spawn, not near the mount -- at
  # x=2.5 the interface site sits 1.70 m from the patch, INSIDE `tag_read_range_m` (2.0 m),
  # so the object would already read as tagged before the robot ever moves. x=3.0 measures
  # 2.0632 m from the interface site to the RCU's BODY ORIGIN (the point Worksite.observe()'s
  # tag-range check actually uses; the top-face patch site is 2.0325 m) [measured:
  # tests/test_worksite.py::test_units_rest_where_staged_and_are_observable, 2026-09-20;
  # reference point corrected 2026-09-21, DECISIONS.md D10].
  staged:
    - {id: rcu_0, xyz_W_m: [3.0, 0.0, 0.05], yaw_rad: 0.0}      # on the ground
    - {id: found_0, xyz_W_m: [2.285, 3.0, 0.05], yaw_rad: 0.0}  # course 1
    - {id: found_1, xyz_W_m: [2.715, 3.0, 0.05], yaw_rad: 0.0}
  pallets: []
  slots:
    - {id: slot_0, xyz_W_m: [2.5, 3.0, 0.15], yaw_rad: 0.0}    # course 2, centred on the foundation
  robot_spawn_xy_yaw: [0.0, 0.0, 0.0]
  to_place: [rcu_0]
script_steps:
  # standoff_m 1.1, not the original draft's 0.9: measured (tests/test_single_placement.py, 2026-09-21) that at
  # 0.9 the arm's own forearm (fr3_link5/6) physically collides with base_link while reaching down
  # to ground level for the "at" grasp pose -- a genuine self-collision (huge servo torque, the
  # flange stalls ~0.03 m short and never settles), not a control-tuning issue. A standoff sweep
  # (0.9/1.0/1.1/1.2/1.3) found 1.0-1.2 clean (zero self-collision depth, acquire completes in
  # ~22-23 s); 1.3 clears self-collision but is too far out for `acquire`'s own `up` lift to
  # complete. 1.1 sits in the middle of the working band.
  - {skill: approach, params: {target: rcu_0, standoff_m: 1.1}}   # [measured: tests/test_single_placement.py, 2026-09-21]
  - {skill: park, params: {}}
  - {skill: acquire, params: {target: rcu_0}}
  # Via stance (DECISIONS.md D16). Driving straight from rcu_0's stance to transport's final stance
  # (x_base = 2.5 - 1.1 = 1.4 m) sweeps the base's FRONT WHEELS through found_0's footprint: the
  # front wheel spheres (module x 0.6 m + radius 0.135 m ahead of the base origin) reach
  # x_base + 0.735 m, and the foundation's near face is at x = 2.285 - 0.215 = 2.07 m, so any
  # transit at x_base > 1.335 m while the wheel line (y_base +- 0.45 m) crosses found_0's y span
  # [2.875, 3.125] shoves it. Measured (2026-09-21, same seed): without this step found_0 ended
  # 176 mm and found_1 96 mm off blueprint (placed-unit disturbance limit 10 mm), contact
  # mpo_700_wheel_front_left_link. A via stance 1.5 m behind the slot keeps the wheels 0.335 m short
  # of the near face during the transit; transport's last 0.4 m then runs with the wheel lines at
  # y = 3.0 +- 0.45 m, 0.19 m clear of the foundation's y span. Measured with it: found_0 / found_1
  # displacement 0.6 / 0.9 mm.
  - {skill: approach, params: {target: slot_0, standoff_m: 1.5}}   # [derived: x_base + 0.735 m <= 2.07 m - 0.3 m clearance; measured: foundation disp 0.6/0.9 mm, 2026-09-21]
  - {skill: transport, params: {target: slot_0, standoff_m: 1.1}}   # [measured: tests/test_single_placement.py, 2026-09-21 -- same self-collision margin, the slot's seat/place geometry]
  - {skill: park, params: {}}
  - {skill: place, params: {target: slot_0, hover_m: 0.15}}
  - {skill: seat, params: {target: slot_0}}
  - {skill: release, params: {}}
  - {skill: retract, params: {height_m: 0.3}}
  - {skill: verify, params: {target: slot_0}}
